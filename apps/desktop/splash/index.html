<!doctype html>
<!--
  GitHub issue #51 / Prompt 9.1, GÖREV 1 — üretim başlangıç ekranı.

  Bu sayfa `tauri.conf.json`'daki `build.frontendDist`'in içeriğidir ve
  SADECE üretim paketlemesinde, apps/web'in gerçek arayüzü (Node sidecar
  süreci, bkz. src-tauri/src/sidecar.rs) hazır olana kadar KISA bir süre
  görünür. apps/web'in KENDİ arayüzü DEĞİLDİR — apps/web'in kod tabanı bu
  paketten tamamen bağımsız kalır (mimari kural, bkz. faz-9-masaustu-
  kabugu.md). Sidecar hazır olduğunda pencere otomatik olarak onun
  adresine yönlendirilir, bu sayfa bir daha görünmez.
-->
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <title>Öğün</title>
    <meta name="color-scheme" content="light dark" />
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #0b0b0b;
        color: #f5f5f5;
      }
      .kabuk {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }
      .logo {
        width: 64px;
        height: 64px;
        border-radius: 16px;
        background: #1b7a5a;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .logo svg {
        width: 34px;
        height: 34px;
      }
      p {
        margin: 0;
        font-size: 14px;
        opacity: 0.75;
      }
      .nokta {
        display: inline-block;
        animation: yanip-son 1.4s infinite ease-in-out;
      }
      .nokta:nth-child(2) {
        animation-delay: 0.2s;
      }
      .nokta:nth-child(3) {
        animation-delay: 0.4s;
      }
      @keyframes yanip-son {
        0%,
        80%,
        100% {
          opacity: 0.2;
        }
        40% {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div class="kabuk">
      <div class="logo" role="img" aria-label="Öğün">
        <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
          <circle cx="24" cy="26" r="11" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="4" />
          <circle
            cx="-26"
            cy="24"
            r="11"
            fill="none"
            stroke="#FFFFFF"
            stroke-width="4"
            stroke-linecap="round"
            stroke-dasharray="47 22"
            transform="rotate(-90)"
          />
        </svg>
      </div>
      <p>Öğün başlatılıyor<span class="nokta">.</span><span class="nokta">.</span><span class="nokta">.</span></p>
    </div>
  </body>
</html>
