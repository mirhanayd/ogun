[package]
name = "ogun-desktop"
version = "0.2.5"
description = "Öğün masaüstü kabuğu — apps/web'i saran Tauri 2.x native pencere."
authors = ["Öğün"]
edition = "2021"
# GitHub issue #51 / Prompt 9.1 — bkz. src-tauri/README yok, açıklamalar
# main.rs içinde. apps/web'in kod tabanı bu paketten hiç ETKİLENMEZ; bu
# yalnızca onu saran native kabuk.
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = { version = "0.5", features = ["std"] }
rand = "0.8"
# Pencere durumu (boyut/konum/maximize) kalıcılığı — GÖREV 2.
tauri-plugin-window-state = "2"
# Dış http(s) linkleri sistem tarayıcısında açmak için — GÖREV 3, bkz.
# navigation.rs / lib.rs. NOT: issue metni "tauri-plugin-shell'in open()"
# diyor; o fonksiyon tauri-plugin-shell 2.1.0'dan beri KULLANIMDAN
# KALDIRILDI ("Use tauri-plugin-opener instead"), bu yüzden AYNI davranışı
# (varsayılan uygulamada http(s)/tel/mailto açma) sağlayan, kaldırılmamış
# resmi halefi tercih edildi — bkz. PR açıklamasındaki not.
tauri-plugin-opener = "2"
url = "2"
# GitHub issue #52 / Prompt 9.2, GÖREV 1 — ogun:// özel URL şemasını
# kaydeder ve yakalar (bkz. deep_link.rs). Sürüm 2.4.9 olarak çözüldü
# (bkz. Cargo.lock) — bu sandbox'ta gerçek network erişimiyle `cargo add`
# ÇALIŞTI, bu yüzden bu sürüm TAHMİN değil, doğrulanmış.
tauri-plugin-deep-link = "2"
# GÖREV 3 — oturum (bearer) token'ının güvenli/şifreli depolanması.
# NEDEN STRONGHOLD (OS keychain DEĞİL): resmi tauri-apps organizasyonunun
# TEK ilk-taraf "secret storage" eklentisi bu — ayrı bir OS keychain
# eklentisi (macOS Keychain/Windows Credential Manager/Linux Secret
# Service) resmi Tauri eklenti ekosisteminde YOK; kendi yazacağımız bir
# `keyring` crate sarmalayıcısı platforma özgü 3 AYRI native API'ye
# (ve bu sandbox'ta zaten kanıtlanmış kırık bağlayıcı sorununa EK riske)
# ihtiyaç duyardı. Stronghold saf/taşınabilir bir şifreli kasa — Windows
# ÖNCELİKLİ dağıtım sırası (bkz. faz-9-masaustu-kabugu.md Prompt 9.4) için
# daha öngörülebilir. bkz. secure_storage.rs dosya başı notu: bu paketin
# JS-çağrılabilir genel amaçlı komutları (initialize/save_store_record/...)
# KULLANILMIYOR — sadece `stronghold::Stronghold` ve `kdf::KeyDerivation`
# Rust API'leri DOĞRUDAN, kendi 3 dar kapsamlı komutumuzun içinde.
tauri-plugin-stronghold = "2"
# Windows/Linux'ta ikinci bir "ogun://..." tıklaması normalde YENİ bir
# süreç başlatır (uygulama zaten açıkken bile) — bu eklenti olmadan
# GÖREV 1'deki OAuth deep link'i ÇALIŞAN pencereye asla ULAŞMAZ. "deep-link"
# özelliği (feature), ikinci süreç argümanlarını OTOMATİK olarak
# tauri-plugin-deep-link'e iletir (bkz. lib.rs ve o paketin kaynak kodundaki
# Builder::callback varsayılanı). macOS bunu işletim sistemi düzeyinde zaten
# native olarak hallettiğinden bu eklenti orada devreye GİRMEZ.
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
# Cihazda kayıtlı hesap varsa işletim sistemi oturumu açıldığında Öğün'ü
# arka planda başlatır. `--autostart-hidden` argümanı pencerenin besin kataloğu
# hazırlanana kadar görünmemesini sağlar (bkz. startup.rs).
# GitHub issue #53 / Prompt 9.3, GÖREV 3 — native OS bildirimleri (bkz.
# notifications.rs). Sürüm 2.3.3 olarak çözüldü (bkz. Cargo.lock) — bu
# sandbox'ta gerçek network erişimiyle `cargo add` ÇALIŞTI, TAHMİN değil.
tauri-plugin-notification = "2"
# GÖREV 4 — native "Farklı Kaydet" (PDF indirme) ve native dosya seçici
# (belge yükleme) diyalogları (bkz. file_ops.rs). Sürüm 2.7.2 çözüldü.
tauri-plugin-dialog = "2"
# GÖREV 4 — dialog'un seçtiği/kaydettiği yoldan GERÇEK byte okuma/yazma
# (JS tarafında @tauri-apps/plugin-fs `readFile`/`writeFile`) için — dialog
# eklentisi SADECE yol seçtirir, dosya I/O'sunu YAPMAZ. Sürüm 2.5.1 çözüldü
# (tauri-plugin-dialog'un kendisi de buna bağımlı, bkz. yukarıdaki `cargo
# add` çıktısı — burada AYRICA açıkça bağımlılık olarak listeliyoruz çünkü
# JS tarafı doğrudan bu paketin API'sini çağırıyor, sadece dialog'un
# transitive bağımlılığına GÜVENMİYORUZ).
tauri-plugin-fs = "2"
# GitHub issue #54 / Prompt 9.4, GÖREV 3 — otomatik güncelleme (bkz.
# updater.rs). Sürüm 2.10.1 olarak çözüldü (bkz. Cargo.lock) — bu
# sandbox'ta gerçek network erişimiyle `cargo add tauri-plugin-updater`
# ÇALIŞTI, TAHMİN değil (`cargo add`'in Cargo.toml'a otomatik yazdığı
# "2.0.0-rc.4" gereksinimi diğer eklentilerle AYNI gevşek "2" caret'ine
# ELLE düzeltildi — Cargo'nun ön-sürüm gereksinim kuralları 2.10.1'in
# yine de eşleştiğini DOĞRULADI, bkz. Cargo.lock).
tauri-plugin-updater = "2"

[target.'cfg(windows)'.dependencies]
# Windows başlangıç kaydı için yalnız HKCU Run anahtarına erişen küçük native
# bağımlılık. Genel amaçlı autostart eklentisinin NSIS paketinde Defender
# Contebrew.A!ml yanlış pozitifini tetiklemesi nedeniyle doğrudan kullanılır.
winreg = "0.10"

[dependencies.tauri]
version = "2"
# GÖREV 2 — görev çubuğu/menü çubuğu simgesi (tray). `TrayIconBuilder`,
# `tauri` çekirdek crate'inde YAŞAR (ayrı bir eklenti paketi YOK) ama
# `tray-icon` bir Cargo feature'ı ARKASINDA (varsayılan KAPALI) — bkz.
# PR açıklaması: bu sandbox'ta `cargo add tauri@2 --dry-run` çıktısı
# feature listesini DOĞRULADI ("- tray-icon" opsiyonel özellikler
# arasında). Menü çubuğu (Menu/MenuBuilder/MenuItem) İSE herhangi bir
# ek feature GEREKTİRMEZ, çekirdekte varsayılan olarak açık.
features = ["tray-icon"]

[lib]
# `cargo check`/`cargo test` gibi araçların ve gelecekteki mobil hedeflerin
# kütüphaneyi bulabilmesi için Tauri'nin standart adlandırması.
name = "ogun_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "ogun-desktop"
path = "src/main.rs"

# GitHub issue #46'da (Windows symlink/EPERM) olduğu gibi, burada da
# platforma özgü bir tuzak YOK — Cargo/rustc çıktı dizinleri symlink
# kullanmaz. Ancak MSVC bağlayıcısı (link.exe, "C++ ile masaüstü
# geliştirme" iş yükü) bu sandbox'ta kurulu değil; bkz. PR açıklaması ve
# README.md "Masaüstü geliştirme" bölümündeki doğrulama notu.
