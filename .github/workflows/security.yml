name: Security gate

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.19.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:env:schema
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm audit --audit-level high
      - run: pnpm audit --prod --audit-level high

  rust-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: rustsec/audit-check@858dc40f52ca2b8570b7a997c1c4e35c6fc9a432 # pinned HEAD 2026-09-11
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@4b7d1d3a6827691637eff750b6482042e06462d0 # pinned HEAD 2026-09-11
        with:
          extra_args: --only-verified

  codeql:
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    strategy:
      matrix:
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
